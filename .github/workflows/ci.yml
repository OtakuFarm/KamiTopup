# Continuous Integration – runs on every PR and push
# Checks backend syntax + basic health of structure

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check main files
        run: |
          node --check server.js
          node --check config/db.js
          node --check services/supplier.js
          node --check services/products.js
          node --check controllers/orderController.js

      - name: Ensure required files exist
        run: |
          test -f package.json
          test -f .env.example
          test -f server.js
          test -d routes
          test -d services
          test -d middleware

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check critical frontend files
        run: |
          test -f index.html
          test -f pages/checkout.html
          test -f pages/game.html
          test -f pages/lookup.html
          test -f pages/support.html
          test -f pages/success.html
          echo "Frontend structure OK"
