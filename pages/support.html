<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support – KamiTopup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7c3aed',
            secondary: '#06b6d4',
            dark: '#0f0f13',
            card: '#1a1a24',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>body { background-color: #0f0f13; }</style>
</head>
<body class="text-white font-sans antialiased min-h-screen">

  <nav class="fixed top-0 w-full z-50 bg-dark/90 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center font-bold">K</div>
        <span class="text-xl font-bold">KamiTopup</span>
      </a>
      <a href="../index.html" class="text-sm text-gray-400 hover:text-white">← Home</a>
    </div>
  </nav>

  <main class="pt-28 pb-16 px-4">
    <div class="max-w-lg mx-auto">
      <h1 class="text-2xl font-bold mb-2 text-center">Contact Support</h1>
      <p class="text-gray-400 text-center text-sm mb-8">We usually reply within a few hours</p>

      <div id="formBox" class="bg-card rounded-2xl border border-white/10 p-6">
        <form id="supportForm" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Your Email *</label>
            <input type="email" id="email" required placeholder="you@email.com"
              class="w-full px-4 py-3 rounded-xl bg-dark border border-white/10 focus:border-primary focus:outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Order ID (optional)</label>
            <input type="text" id="orderId" placeholder="NT12345678"
              class="w-full px-4 py-3 rounded-xl bg-dark border border-white/10 focus:border-primary focus:outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Subject *</label>
            <input type="text" id="subject" required placeholder="e.g. Top-up not received"
              class="w-full px-4 py-3 rounded-xl bg-dark border border-white/10 focus:border-primary focus:outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Message *</label>
            <textarea id="message" required rows="4" placeholder="Describe your issue..."
              class="w-full px-4 py-3 rounded-xl bg-dark border border-white/10 focus:border-primary focus:outline-none resize-none"></textarea>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-xl bg-primary hover:bg-violet-600 font-semibold transition">
            Submit Ticket
          </button>
        </form>
      </div>

      <div id="successBox" class="hidden bg-card rounded-2xl border border-green-500/30 p-6 text-center">
        <i class="fas fa-check-circle text-4xl text-green-400 mb-4"></i>
        <h2 class="text-xl font-bold mb-2">Ticket Submitted</h2>
        <p class="text-gray-400 mb-2">Your ticket ID:</p>
        <p class="font-mono text-primary text-lg mb-4" id="ticketId"></p>
        <p class="text-sm text-gray-500">Please save this ID. We will reply to your email.</p>
        <a href="../index.html" class="inline-block mt-6 px-6 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 transition">Back to Home</a>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById('supportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch(API_BASE + '/support', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            orderId: document.getElementById('orderId').value.trim() || null,
            subject: document.getElementById('subject').value.trim(),
            message: document.getElementById('message').value.trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');

        document.getElementById('formBox').classList.add('hidden');
        document.getElementById('successBox').classList.remove('hidden');
        document.getElementById('ticketId').textContent = data.ticketId;
      } catch (err) {
        alert(err.message || 'Could not submit ticket');
        btn.disabled = false;
        btn.textContent = 'Submit Ticket';
      }
    });
  </script>
</body>
</html>
