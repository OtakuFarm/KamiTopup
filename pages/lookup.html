<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Lookup – KamiTopup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#7c3aed',
            secondary: '#06b6d4',
            dark: '#0f0f13',
            card: '#1a1a24',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>body { background-color: #0f0f13; }</style>
</head>
<body class="text-white font-sans antialiased min-h-screen">

  <nav class="fixed top-0 w-full z-50 bg-dark/90 backdrop-blur-md border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center font-bold">K</div>
        <span class="text-xl font-bold">KamiTopup</span>
      </a>
      <a href="../index.html" class="text-sm text-gray-400 hover:text-white">← Home</a>
    </div>
  </nav>

  <main class="pt-28 pb-16 px-4">
    <div class="max-w-lg mx-auto">
      <h1 class="text-2xl font-bold mb-2 text-center">Order Lookup</h1>
      <p class="text-gray-400 text-center text-sm mb-8">Search by Order ID or Email used at checkout</p>

      <div class="bg-card rounded-2xl border border-white/10 p-6 mb-6">
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Order ID</label>
            <input type="text" id="orderId" placeholder="e.g. NT12345678"
              class="w-full px-4 py-3 rounded-xl bg-dark border border-white/10 focus:border-primary focus:outline-none">
          </div>
          <div class="text-center text-gray-500 text-sm">— or —</div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Email</label>
            <input type="email" id="email" placeholder="you@email.com"
              class="w-full px-4 py-3 rounded-xl bg-dark border border-white/10 focus:border-primary focus:outline-none">
          </div>
          <button id="searchBtn" class="w-full py-3.5 rounded-xl bg-primary hover:bg-violet-600 font-semibold transition">
            <i class="fas fa-search mr-2"></i> Search Orders
          </button>
        </div>
      </div>

      <div id="results" class="hidden space-y-4"></div>
      <div id="empty" class="hidden text-center text-gray-500 py-8">
        <i class="fas fa-inbox text-3xl mb-3"></i>
        <p>No orders found</p>
      </div>
      <div id="error" class="hidden text-center text-red-400 py-4"></div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById('searchBtn').addEventListener('click', search);
    document.getElementById('orderId').addEventListener('keydown', e => e.key === 'Enter' && search());
    document.getElementById('email').addEventListener('keydown', e => e.key === 'Enter' && search());

    async function search() {
      const orderId = document.getElementById('orderId').value.trim();
      const email = document.getElementById('email').value.trim();
      const results = document.getElementById('results');
      const empty = document.getElementById('empty');
      const error = document.getElementById('error');

      results.classList.add('hidden');
      empty.classList.add('hidden');
      error.classList.add('hidden');
      results.innerHTML = '';

      if (!orderId && !email) {
        error.textContent = 'Please enter an Order ID or Email';
        error.classList.remove('hidden');
        return;
      }

      try {
        let orders = [];

        if (orderId) {
          const res = await fetch(API_BASE + '/orders/' + encodeURIComponent(orderId));
          if (res.ok) {
            const o = await res.json();
            orders = [o];
          }
        } else if (email) {
          // Lookup by email (requires backend support)
          const res = await fetch(API_BASE + '/orders/lookup?email=' + encodeURIComponent(email));
          if (res.ok) {
            const data = await res.json();
            orders = data.orders || [];
          }
        }

        if (orders.length === 0) {
          empty.classList.remove('hidden');
          return;
        }

        results.classList.remove('hidden');
        results.innerHTML = orders.map(o => {
          const statusColor = {
            completed: 'text-green-400',
            failed: 'text-red-400',
            processing: 'text-yellow-400',
            refunded: 'text-blue-400'
          }[o.status] || 'text-gray-400';

          return `
            <div class="bg-card rounded-2xl border border-white/10 p-5">
              <div class="flex justify-between items-start mb-3">
                <div class="font-mono text-sm">${o.orderId || o.id}</div>
                <span class="font-medium ${statusColor}">${o.status}</span>
              </div>
              <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-gray-400">Game</span><span class="capitalize">${o.game}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Package</span><span>${o.package || o.package_amount}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Player ID</span><span class="font-mono">${o.playerId || o.player_id}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Price</span><span>$${Number(o.price || o.package_price).toFixed(2)}</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Date</span><span class="text-xs">${o.createdAt || o.created_at || '—'}</span></div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        error.textContent = 'Could not reach server. Please try again later.';
        error.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
